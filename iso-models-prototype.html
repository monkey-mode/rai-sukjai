<!-- 3D MODEL SOURCE: the buffalo and dragon jar built as 3D models (ellipsoids / a solid of revolution) and
     projected with the farm's exact isometric math. tools/export-models.mjs exports them as the game's

<body>
<div id="wrap">
  <header><b>ต้นแบบโมเดลไอโซเมตริก · ควาย & โอ่งมังกร</b>
    <small>Isometric models prototype: buffalo and dragon jar built in 3D and projected with the farm's 2:1 iso math (left), next to the current hand-drawn assets (right)</small></header>
  <div id="bar">

<script src="js/logic/config.js"></script>

<script src="js/art/assets.js"></script>
<script>
'use strict';
// ---------- projection: same 2:1 iso as js/art/iso.js (1 world unit = 1 px along an axis) ----------
const K = 0.894, H = 0.447;
const proj = (x, y, z) => [(x - y) * K, (x + y) * H - z];           // world -> screen offset
const fmt = n => Math.round(n * 10) / 10;

// Convex hull (monotone chain) of projected points -> smooth-ish closed path.
function hull(pts) {
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of pts.slice().reverse()) { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
const pathOf = pts => 'M' + pts.map(p => fmt(p[0]) + ' ' + fmt(p[1])).join('L') + 'Z';

// ---------- a model is a list of ellipsoids in local space (forward = +x, left = +y, up = +z) ----------
// Each: { c:[x,y,z], r:[rx,ry,rz], fill, pivot?: 'head'|'tail', noLine? }
function buffaloParts() {
  const g = '#5d626b', gd = '#4a4e56', gl = '#8a8f98', horn = '#e2d6c0';
  const P = [];
  const add = (c, r, fill, extra = {}) => P.push(Object.assign({ c, r, fill }, extra));
  // a smooth tube: many overlapping spheres interpolated along control points [x, y, z, radius]
  const tube = (ctrl, fill, extra, per = 4) => {
    for (let i = 0; i < ctrl.length - 1; i++) for (let k = 0; k < per; k++) {
      const t = k / per, a = ctrl[i], b = ctrl[i + 1], q = a.map((v, n) => v + (b[n] - v) * t);
      add([q[0], q[1], q[2]], [q[3], q[3], q[3]], fill, extra);
    }
    const e = ctrl[ctrl.length - 1]; add([e[0], e[1], e[2]], [e[3], e[3], e[3]], fill, extra);
  };
  // legs (hooves first), body masses, neck
  for (const [x, y] of [[22, 11], [22, -11], [-24, 11], [-24, -11]]) {
    add([x, y, 3], [5, 5, 3], '#2e3035');
    add([x, y, 13], [4.6, 4.6, 12], x > 0 ? g : gd);
  }
  P.forEach(p => { p.group = 'body'; });
  add([-24, 0, 36], [16, 18, 15], g);                 // rump
  add([0, 0, 35], [36, 20, 17], g);                   // barrel
  add([18, 0, 40], [16, 18, 15], g);                  // shoulders
  add([32, 0, 38], [11, 11, 11], g, { pivot: 'head' });           // neck
  // head group (pivots at the neck for grazing)
  add([45, 0, 33], [11, 10, 10], g, { pivot: 'head' });
  add([54, 0, 26], [7, 8.5, 6.5], gl, { pivot: 'head' });          // muzzle
  for (const s of [1, -1]) {
    add([42, 11 * s, 37], [3, 5.5, 2.2], gd, { pivot: 'head' });   // ears
    add([50, 6 * s, 35], [1.8, 1.8, 1.8], '#fff', { pivot: 'head', eye: true });
    // horns: a chain of shrinking spheres sweeping out and back
    tube([[44, 7 * s, 41, 3.8], [42, 14 * s, 44, 3.4], [37, 21 * s, 46, 3], [31, 26 * s, 46, 2.5], [27, 28 * s, 43, 1.9], [25, 28 * s, 40, 1.2]], horn, { pivot: 'head' });
  }
  // tail (swings about its root)
  tube([[-39, 0, 39, 2.4], [-43, 0, 32, 1.9], [-45, 0, 24, 1.6], [-46, 0, 17, 1.6]], gd, { pivot: 'tail' });
  add([-46, 0, 13], [3, 3, 4.2], '#2e3035', { pivot: 'tail' });
  // egret riding on the back
  add([-2, 0, 55], [7, 4, 4], '#fff');
  add([3, 0, 62], [2, 2, 5], '#fff');
  add([6, 0, 67], [3, 2.4, 2.4], '#fff');
  add([10, 0, 67], [3, 1, 1], '#f2c14e');
  P.forEach(p => { if (!p.group) p.group = p.pivot || (p.fill === '#fff' || p.fill === '#f2c14e' ? 'egret' : 'body'); });
  P.forEach(p => { if (p.eye) p.group = 'head'; });
  return P;
}

// Rotate a local point: grazing pitch about the neck, tail swing, then the model's yaw.
function transform(p, part, pose) {
  let [x, y, z] = p;
  if (part.pivot === 'head' && pose.pitch) {
    const [px, pz] = [30, 40], a = pose.pitch;              // pitch nose-down around the neck
    const dx = x - px, dz = z - pz;
    x = px + dx * Math.cos(a) + dz * Math.sin(a); z = pz - dx * Math.sin(a) + dz * Math.cos(a);
  }
  if (part.pivot === 'tail' && pose.swing) {
    const [px, py] = [-40, 0], a = pose.swing;
    const dx = x - px, dy = y - py;
    x = px + dx * Math.cos(a) - dy * Math.sin(a); y = py + dx * Math.sin(a) + dy * Math.cos(a);
  }
  const c = Math.cos(pose.yaw), s = Math.sin(pose.yaw);
  return [x * c - y * s, x * s + y * c, z + (pose.bob || 0)];
}

function drawModel(parts, pose, ox, oy, sc = 1.5, light = [-.6, .3, .75], opts = {}) {
  const P2 = (x, y, z) => { const [sx, sy] = proj(x, y, z); return [ox + sx * sc, oy + sy * sc]; };
  // ground shadow
  const sh = [];
  for (let a = 0; a < 360; a += 15) {
    const t = a * Math.PI / 180, [x, y] = transform([Math.cos(t) * 40, Math.sin(t) * 22, 0], {}, { yaw: pose.yaw });
    sh.push(P2(x, y, 0));
  }
  let out = opts.noShadow ? '' : `<path d="${pathOf(sh)}" fill="rgba(58,34,19,.18)"/>`;
  if (opts.only) parts = parts.filter(p => opts.only.includes(p.group));
  // project every part once
  const shapes = parts.map(part => {
    const pts = [], hi = [];
    const small = Math.max(...part.r) < 4, NV = small ? 4 : 8, NU = small ? 8 : 16;   // fewer samples for tiny parts
    for (let i = 0; i <= NV; i++) {
      const v = -Math.PI / 2 + i * Math.PI / NV;
      for (let j = 0; j < NU; j++) {
        const u = j * 2 * Math.PI / NU;
        const local = [part.c[0] + part.r[0] * Math.cos(v) * Math.cos(u), part.c[1] + part.r[1] * Math.cos(v) * Math.sin(u), part.c[2] + part.r[2] * Math.sin(v)];
        const q = P2(...transform(local, part, pose));
        pts.push(q);
        const nw = transform([Math.cos(v) * Math.cos(u), Math.cos(v) * Math.sin(u), Math.sin(v)], {}, { yaw: pose.yaw });
        if (nw[0] * light[0] + nw[1] * light[1] + nw[2] * light[2] > .72) hi.push(q);
      }
    }
    const c = transform(part.c, part, pose);
    return { part, d: pathOf(hull(pts)), hi: hi.length > 2 ? pathOf(hull(hi)) : '', depth: c[0] + c[1] + c[2] * .02, centre: P2(...c) };
  });
  // groups (body, head, tail, egret) drawn back to front; inside a group: outline pass, then fills
  const groups = {};
  shapes.forEach(sh => { (groups[sh.part.group] = groups[sh.part.group] || []).push(sh); });
  const order = Object.values(groups).map(list => ({ list, depth: list.reduce((a, s2) => a + s2.depth, 0) / list.length }))
    .sort((a, b) => a.depth - b.depth);
  for (const { list } of order) {
    list.sort((a, b) => a.depth - b.depth);
    out += list.filter(x => !x.part.eye).map(x => `<path d="${x.d}" fill="#3a2213" stroke="#3a2213" stroke-width="${Math.max(...x.part.r) < 4 ? 3 : 5}" stroke-linejoin="round"/>`).join('');
    for (const x of list) {
      if (x.part.eye) {
        out += `<path d="${x.d}" fill="#fff" stroke="#3a2213" stroke-width="1"/><circle cx="${fmt(x.centre[0] + .6)}" cy="${fmt(x.centre[1])}" r="1.3" fill="#3a2213"/>`;
      } else {
        out += `<path d="${x.d}" fill="${x.part.fill}"/>`;
        if (x.hi && Math.max(...x.part.r) >= 6) out += `<path d="${x.hi}" fill="#fff" opacity=".13"/>`;
      }
    }
  }
  return out;
}

// ---------- dragon jar as a solid of revolution ----------
const jarR = h => h < 4 ? 22 + h : h < 38 ? 26 + 14 * Math.sin((h - 4) / 34 * Math.PI / 2) : h < 70 ? 40 - 16 * Math.sin((h - 38) / 32 * Math.PI / 2) : h < 74 ? 24 : 26;
// The jar can turn (rot, radians) so the dragon travels around it; sc scales the whole drawing.
function drawJar(ox, oy, rot = 0, sc = 1, time = 0, opts = {}) {
  const O = '#3a2213';
  const P3 = (x, y, z) => { const [sx, sy] = proj(x, y, z); return [ox + sx * sc, oy + sy * sc]; };
  // a point on the jar surface at angle t (jar space), height h, pushed out by `off`
  const surf = (t, h, off = 0) => { const a = t + rot, r = jarR(h) + off; return P3(Math.cos(a) * r, Math.sin(a) * r, h); };
  // facing the viewer when the surface normal points toward +x+y (the bottom of the screen)
  const facing = t => Math.cos(t + rot) + Math.sin(t + rot);
  const ring = (h, r, a0 = 0, a1 = 360, step = 10) => {
    const out = [];
    for (let a = a0; a <= a1; a += step) { const t = a * Math.PI / 180; out.push(P3(Math.cos(t) * r, Math.sin(t) * r, h)); }
    return out;
  };
  const pl = (pts, col, w, extra = '') => `<path d="M${pts.map(p => fmt(p[0]) + ' ' + fmt(p[1])).join('L')}" fill="none" stroke="${col}" stroke-width="${fmt(w)}" stroke-linecap="round" stroke-linejoin="round"${extra}/>`;
  let all = [];
  for (let h = 0; h <= 76; h += 2) all = all.concat(ring(h, jarR(h), 0, 360, 12));
  let s = opts.noShadow ? '' : `<path d="${pathOf(ring(0, 34))}" fill="rgba(58,34,19,.18)"/>`;
  s += `<path d="${pathOf(hull(all))}" fill="#7b3a1a" stroke="${O}" stroke-width="${3 * Math.min(1.4, sc)}" stroke-linejoin="round"/>`;
  // shading: the right-hand half is in shadow (light comes from the upper-left)
  const shade = [];
  for (let h = 2; h <= 74; h += 2) { const r = jarR(h); for (const a of [-80, -45, -15]) { const t = a * Math.PI / 180; shade.push(P3(Math.cos(t) * r, Math.sin(t) * r, h)); } }
  s += `<path d="${pathOf(hull(shade))}" fill="#5f2b12" opacity=".75"/>`;
  // glaze highlight on the lit side
  const lit = []; for (let h = 10; h <= 60; h += 3) { const r = jarR(h) * .9, t = 148 * Math.PI / 180; lit.push(P3(Math.cos(t) * r, Math.sin(t) * r, h)); }
  s += pl(lit, 'rgba(255,255,255,.3)', 4 * sc) + pl(lit.slice(3, 7), 'rgba(255,255,255,.45)', 2 * sc);
  // gold bands (front half of each ring)
  for (const h of [12, 62]) s += pl(ring(h, jarR(h) + .3, -45, 135, 6), '#d9a32a', 2.2 * sc) + pl(ring(h + 2.5, jarR(h + 2.5) + .3, -45, 135, 6), '#b8801e', 1 * sc);
  // cloud scrolls painted on the glaze; they turn with the jar and hide round the back
  for (const [ta, h] of [[20, 22], [95, 50], [170, 24], [250, 50], [320, 28], [140, 70 - 18], [60, 20]]) {
    const t = ta * Math.PI / 180;
    if (facing(t) < .25) continue;
    const c = surf(t, h, .5), k = sc * Math.min(1, facing(t));
    s += `<path d="M${fmt(c[0] - 7 * k)} ${fmt(c[1])}q${fmt(2 * k)} ${fmt(-4 * k)} ${fmt(6 * k)} ${fmt(-2 * k)}q${fmt(3 * k)} ${fmt(-4 * k)} ${fmt(7 * k)} 0q${fmt(3 * k)} 0 ${fmt(3 * k)} ${fmt(3 * k)}q${fmt(-2 * k)} ${fmt(2 * k)} ${fmt(-4 * k)} 0" fill="none" stroke="#f6e3b0" stroke-width="${fmt(1.8 * sc)}" stroke-linecap="round"/>`;
  }
  // ---- the dragon: a tube following a wave around the belly, drawn only where it faces the viewer ----
  const N = 90, span = 330 * Math.PI / 180, t0 = -30 * Math.PI / 180;
  const path = [];
  for (let i = 0; i <= N; i++) {
    const u = i / N, t = t0 + u * span, h = 38 + 9 * Math.sin(u * Math.PI * 3.2);
    path.push({ u, t, h, vis: facing(t), w: (u < .08 ? 7.5 : 7.5 * (1 - (u - .08) * .75)) });
  }
  const runs = []; let cur = [];
  for (const p of path) { if (p.vis > .05) cur.push(p); else if (cur.length) { runs.push(cur); cur = []; } }
  if (cur.length) runs.push(cur);
  for (const run of runs) {
    const pts = run.map(p => surf(p.t, p.h, 1.5));
    // dorsal fin: small spikes above the body
    for (let i = 2; i < run.length; i += 3) {
      const p = run[i], a = surf(p.t, p.h + p.w * .55, 1.5), b = surf(p.t, p.h + p.w * .55 + 5, 2), c = surf(p.t + .05, p.h + p.w * .55, 1.5);
      s += `<path d="M${fmt(a[0])} ${fmt(a[1])}L${fmt(b[0])} ${fmt(b[1])}L${fmt(c[0])} ${fmt(c[1])}Z" fill="#e2553f" stroke="${O}" stroke-width="${fmt(Math.min(1.2, .6 * sc))}" stroke-linejoin="round"/>`;
    }
    const wAvg = run.reduce((a, p) => a + p.w, 0) / run.length;
    s += pl(pts, O, (wAvg + 3) * sc) + pl(pts, '#f2c14e', wAvg * sc);
    s += pl(run.map(p => surf(p.t, p.h - p.w * .28, 1.8)), '#fbe39a', wAvg * .35 * sc);           // pale belly stripe
    for (let i = 1; i < run.length; i += 2) {                                                    // scales
      const q = surf(run[i].t, run[i].h + run[i].w * .12, 2);
      s += `<path d="M${fmt(q[0] - 2 * sc)} ${fmt(q[1])}q${fmt(2 * sc)} ${fmt(2 * sc)} ${fmt(4 * sc)} 0" fill="none" stroke="#c98f1e" stroke-width="${fmt(1 * sc)}"/>`;
    }
  }
  // clawed legs at three points along the body
  for (const u of [.18, .45, .72]) {
    const p = path[Math.round(u * N)];
    if (p.vis < .2) continue;
    const a = surf(p.t, p.h - 4, 1.8), b = surf(p.t - .08, p.h - 13, 1.6);
    s += pl([a, b], O, 5.5 * sc) + pl([a, b], '#f2c14e', 3.2 * sc);
    s += `<path d="M${fmt(b[0])} ${fmt(b[1])}l${fmt(-3 * sc)} ${fmt(3 * sc)}M${fmt(b[0])} ${fmt(b[1])}l${fmt(0)} ${fmt(4 * sc)}M${fmt(b[0])} ${fmt(b[1])}l${fmt(3 * sc)} ${fmt(3 * sc)}" stroke="${O}" stroke-width="${fmt(1.3 * sc)}" fill="none" stroke-linecap="round"/>`;
  }
  // head at the front end, chasing the flaming pearl
  const hd = path[0];
  if (hd.vis > .1) {
    const c = surf(hd.t - .08, hd.h + 1, 3), k = sc;
    s += `<path d="M${fmt(c[0] + 4 * k)} ${fmt(c[1] - 7 * k)}l${fmt(-6 * k)} ${fmt(-8 * k)}l${fmt(2 * k)} ${fmt(8 * k)}ZM${fmt(c[0] + 8 * k)} ${fmt(c[1] - 6 * k)}l${fmt(1 * k)} ${fmt(-10 * k)}l${fmt(3 * k)} ${fmt(9 * k)}Z" fill="#e2553f" stroke="${O}" stroke-width="${fmt(1.2 * k)}" stroke-linejoin="round"/>`;
    s += `<path d="M${fmt(c[0] - 8 * k)} ${fmt(c[1])}Q${fmt(c[0] - 6 * k)} ${fmt(c[1] - 9 * k)} ${fmt(c[0] + 4 * k)} ${fmt(c[1] - 8 * k)}Q${fmt(c[0] + 13 * k)} ${fmt(c[1] - 6 * k)} ${fmt(c[0] + 12 * k)} ${fmt(c[1] + 1 * k)}Q${fmt(c[0] + 6 * k)} ${fmt(c[1] + 3 * k)} ${fmt(c[0] + 11 * k)} ${fmt(c[1] + 6 * k)}Q${fmt(c[0] + 2 * k)} ${fmt(c[1] + 9 * k)} ${fmt(c[0] - 8 * k)} ${fmt(c[1])}Z" fill="#f2c14e" stroke="${O}" stroke-width="${fmt(1.8 * k)}" stroke-linejoin="round"/>`;
    s += `<circle cx="${fmt(c[0] + 4 * k)}" cy="${fmt(c[1] - 3 * k)}" r="${fmt(2 * k)}" fill="#fff" stroke="${O}" stroke-width="${fmt(.9 * k)}"/><circle cx="${fmt(c[0] + 4.5 * k)}" cy="${fmt(c[1] - 3 * k)}" r="${fmt(.9 * k)}" fill="${O}"/>`;
    s += `<path d="M${fmt(c[0] + 11 * k)} ${fmt(c[1] + 1 * k)}q${fmt(6 * k)} ${fmt(-2 * k)} ${fmt(9 * k)} ${fmt(3 * k)}M${fmt(c[0] + 10 * k)} ${fmt(c[1] + 4 * k)}q${fmt(5 * k)} ${fmt(3 * k)} ${fmt(6 * k)} ${fmt(8 * k)}" fill="none" stroke="${O}" stroke-width="${fmt(1.1 * k)}" stroke-linecap="round"/>`;
    const pr = surf(hd.t - .42, hd.h + 6, 3);
    if (facing(hd.t - .42) > .1) {
      s += `<path d="M${fmt(pr[0])} ${fmt(pr[1] - 5 * k)}q${fmt(-4 * k)} ${fmt(-5 * k)} 0 ${fmt(-10 * k)}q${fmt(1 * k)} ${fmt(5 * k)} ${fmt(4 * k)} ${fmt(6 * k)}q${fmt(2 * k)} ${fmt(-4 * k)} ${fmt(1 * k)} ${fmt(-7 * k)}q${fmt(5 * k)} ${fmt(5 * k)} ${fmt(1 * k)} ${fmt(11 * k)}Z" fill="#f39c12" stroke="${O}" stroke-width="${fmt(1 * k)}"/>`;
      s += `<circle cx="${fmt(pr[0])}" cy="${fmt(pr[1])}" r="${fmt(4.2 * k)}" fill="#fff6d8" stroke="${O}" stroke-width="${fmt(1.3 * k)}"/><circle cx="${fmt(pr[0] - 1.3 * k)}" cy="${fmt(pr[1] - 1.3 * k)}" r="${fmt(1.2 * k)}" fill="#fff"/>`;
    }
  }
  // rim: lip, dark inner wall, water with a reflection
  s += `<path d="${pathOf(ring(76, 26))}" fill="#5a2a12" stroke="${O}" stroke-width="${fmt(2.6 * Math.min(1.4, sc))}"/>`;
  s += `<path d="${pathOf(ring(76, 21))}" fill="#3e1c0b" stroke="${O}" stroke-width="${fmt(1.2 * sc)}"/>`;
  s += `<path d="${pathOf(ring(70, 19.5))}" fill="#5fb3dd" stroke="${O}" stroke-width="${fmt(1.2 * sc)}"/>`;
  s += pl(ring(70, 12, 200, 250, 5), '#d2f0fb', 1.8 * sc);
  // coconut-shell ladle resting on the rim (turns with the jar)
  const la = -.35 + rot, l0 = P3(Math.cos(la) * 20, Math.sin(la) * 20, 78), l1 = P3(Math.cos(la - .5) * 44, Math.sin(la - .5) * 44, 96);
  s += pl([l0, l1], O, 5 * sc) + pl([l0, l1], '#a8753f', 2.6 * sc);
  s += `<ellipse cx="${fmt(l0[0] - 3 * sc)}" cy="${fmt(l0[1] + 2 * sc)}" rx="${fmt(8 * sc)}" ry="${fmt(4.5 * sc)}" fill="#7a5230" stroke="${O}" stroke-width="${fmt(1.8 * sc)}"/>`;
  return s;
}

// ---------- scene ----------
const DIRS = ['ตะวันออก · E', 'ตะวันออกเฉียงใต้ · SE', 'ใต้ · S', 'ตะวันตกเฉียงใต้ · SW', 'ตะวันตก · W', 'ตะวันตกเฉียงเหนือ · NW', 'เหนือ · N', 'ตะวันออกเฉียงเหนือ · NE'];
const state = { dir: 3, spin: true, walk: false, graze: false, all: false, jar: false, t: 0 };
const PARTS = buffaloParts();

function isoGrid(cx, cy, n) {
  let s = '';
  for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) {
    const c = (a, b) => { const [x, y] = proj(a * 64 / K / 2 * K, b * 64 / K / 2 * K, 0); return [cx + (a - b) * 32, cy + (a + b) * 16]; };
    const p = [c(i, j), c(i + 1, j), c(i + 1, j + 1), c(i, j + 1)];
    s += `<path d="${pathOf(p)}" fill="${(i + j) & 1 ? '#b3c563' : '#bccb6c'}" stroke="#a6b85a" stroke-width="1"/>`;
  }
  return s;
}

let staticKey = '';
function render() {
  const t = state.t;
  const pose = { yaw: state.dir * Math.PI / 4, pitch: state.graze ? .45 + .12 * Math.sin(t * 2) : 0, swing: .35 * Math.sin(t * 2.4), bob: state.walk ? Math.abs(Math.sin(t * 6)) * 1.5 : 0 };
  const key = state.jar ? 'jar' : state.all ? 'all' : 'one';
  if (key !== staticKey) {
    staticKey = key;
    let st = state.jar ? isoGrid(480, 170, 5) : state.all ? isoGrid(480, 150, 5) : isoGrid(300, 120, 5);
    if (state.jar) {
      st += `<text x="330" y="540" text-anchor="middle" font-family="Kanit" font-size="15" fill="#3a2213">โมเดล 3D หมุนได้ · 3D model, turning</text>`;
      st += `<rect x="690" y="16" width="254" height="528" rx="14" fill="rgba(255,244,214,.6)" stroke="#3a2213" stroke-width="2"/>`;
      st += `<text x="817" y="42" text-anchor="middle" font-family="Kanit" font-size="15" fill="#3a2213">แบบปัจจุบัน · Current asset</text>`;
      st += `<image href="assets/props/dragon_jar.svg" x="717" y="160" width="200" height="200"/>`;
    }
    if (!state.all && !state.jar) {
      st += `<text x="300" y="540" text-anchor="middle" font-family="Kanit" font-size="15" fill="#3a2213">โมเดล 3D ไอโซเมตริก · 3D model, true iso</text>`;
      st += `<rect x="690" y="16" width="254" height="528" rx="14" fill="rgba(255,244,214,.6)" stroke="#3a2213" stroke-width="2"/>`;
      st += `<text x="817" y="42" text-anchor="middle" font-family="Kanit" font-size="15" fill="#3a2213">แบบปัจจุบัน · Current assets</text>`;
      st += `<g transform="translate(810 250)"><image href="assets/animals/buffalo_tail.svg" x="46" y="-60" width="24" height="58"/><image href="assets/animals/buffalo.svg" x="-88" y="-100" width="180" height="124"/><image href="assets/animals/buffalo_head.svg" x="-96" y="-100" width="112" height="88"/></g>`;
      st += `<image href="assets/props/dragon_jar.svg" x="767" y="330" width="100" height="100"/>`;
      st += `<text x="817" y="470" text-anchor="middle" font-family="Sarabun" font-size="12" fill="#3a2213">hand-drawn 3/4, one facing only</text>`;
    }
    document.getElementById('static').innerHTML = st;
  }
  let s = '';
  if (state.jar) {
    s += drawJar(330, 450, state.spin ? t * .5 : state.dir * Math.PI / 4, 2.6, t);
  } else if (state.all) {
    DIRS.forEach((d, i) => {
      const x = 120 + (i % 4) * 240, y = 250 + Math.floor(i / 4) * 230;
      s += drawModel(PARTS, { yaw: i * Math.PI / 4, pitch: 0, swing: .3 * Math.sin(t * 2.4 + i) }, x, y, 1.25);
      s += `<text x="${x}" y="${y + 50}" text-anchor="middle" font-family="Kanit" font-size="14" fill="#3a2213">${d}</text>`;
    });
  } else {
    let wx = 0, wy = 0;
    if (state.walk) { const d = ((t * 22) % 140) - 70; wx = Math.cos(pose.yaw) * d; wy = Math.sin(pose.yaw) * d; }
    const [sx, sy] = proj(wx, wy, 0);
    s += drawModel(PARTS, pose, 290 + sx * 1.5, 340 + sy * 1.5);
    s += drawJar(560, 400, state.spin ? t * .5 : 0);
  }
  document.getElementById('live').innerHTML = s;
  document.getElementById('dir').textContent = DIRS[state.dir];
}

const btn = id => document.getElementById(id);
btn('left').onclick = () => { state.dir = (state.dir + 7) % 8; state.spin = false; btn('spin').classList.remove('on'); render(); };
btn('right').onclick = () => { state.dir = (state.dir + 1) % 8; state.spin = false; btn('spin').classList.remove('on'); render(); };
for (const k of ['spin', 'walk', 'graze', 'all', 'jar']) btn(k).onclick = () => { state[k] = !state[k]; btn(k).classList.toggle('on', state[k]); render(); };
let last = 0, acc = 0;
function tick(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts; state.t += dt;
  if (state.spin) { acc += dt; if (acc > 1.2) { acc = 0; state.dir = (state.dir + 1) % 8; } }
  render();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
window.__proto = { state, render };

// ---------- asset export (used by tools/export-models.mjs) ----------
// Renders each model piece at the origin, measures it, and returns a self-contained SVG plus its anchor.
// The farm buffalo faces East (down-right); the jar is turned 90° so the dragon's head and pearl face front.
window.__exportModels = function () {
  const NS = 'http://www.w3.org/2000/svg';
  const host = document.createElementNS(NS, 'svg');
  host.style.cssText = 'position:absolute;left:-9999px;top:0;width:10px;height:10px';
  document.body.appendChild(host);
  const pack = (markup, ax, ay, title) => {
    host.innerHTML = `<g>${markup}</g>`;
    const b = host.firstChild.getBBox(), pad = 4;
    const x0 = Math.floor(b.x - pad), y0 = Math.floor(b.y - pad), w = Math.ceil(b.x + b.width + pad) - x0, h = Math.ceil(b.y + b.height + pad) - y0;
    const svg = `<svg xmlns="${NS}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">\n<!-- ${title} -->\n<g transform="translate(${-x0} ${-y0})">${markup}</g>\n</svg>\n`;
    return { svg, canvas: [w, h], anchor: [ax - x0, ay - y0] };
  };
  const SC = 1.1, pose = { yaw: 0, pitch: 0, swing: 0 };   // facing East (down-right)
  const at = (local, part) => { const [x, y, z] = transform(local, part, pose), [sx, sy] = proj(x, y, z); return [sx * SC, sy * SC]; };
  const headPivot = at([30, 0, 40], { pivot: 'head' }), tailPivot = at([-40, 0, 38], { pivot: 'tail' });
  const round = p => p.map(v => Math.round(v));
  const hp = round(headPivot), tp = round(tailPivot);
  // draw each part so its pivot sits exactly on an integer pixel
  const body = pack(drawModel(PARTS, pose, 0, 0, SC, undefined, { noShadow: true, only: ['body', 'egret'] }), 0, 0,
    'animal.buffalo · exported from the 3D model in iso-models-prototype.html (facing East). Anchor = ground under the body');
  const head = pack(drawModel(PARTS, pose, -headPivot[0] + hp[0], -headPivot[1] + hp[1], SC, undefined, { noShadow: true, only: ['head'] }), hp[0], hp[1],
    'animal.buffalo_head · exported from the 3D model. Anchor = neck pivot');
  const tail = pack(drawModel(PARTS, pose, -tailPivot[0] + tp[0], -tailPivot[1] + tp[1], SC, undefined, { noShadow: true, only: ['tail'] }), tp[0], tp[1],
    'animal.buffalo_tail · exported from the 3D model. Anchor = tail root pivot');
  const jar = pack(drawJar(0, 0, Math.PI / 2, .86, 0, { noShadow: true }), 0, 0,   // turned so the dragon's head and pearl face front
    'prop.dragon_jar · exported from the 3D model in iso-models-prototype.html. Anchor = centre of the base');
  host.remove();
  return {
    'animal.buffalo': body, 'animal.buffalo_head': head, 'animal.buffalo_tail': tail, 'prop.dragon_jar': jar,
    parts: { head: hp, tail: tp },
  };
};
</script>
