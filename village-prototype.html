<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Village Map Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Prototype only: an isometric village map; tapping a place goes inside to a front-view scene. */
  #vp{position:relative;width:1067px;height:600px;flex:none;overflow:hidden;background:#a9c95e;transform-origin:50% 50%}
  #vp>svg{position:absolute;inset:0;width:1067px;height:600px}
  #vp .place{cursor:pointer}
  #vp .place:hover .plate{filter:brightness(1.1) drop-shadow(0 0 6px #fff5a0)}
  #vpPanel{position:absolute;left:133.5px;top:46px;width:800px;height:554px;pointer-events:none}
  #vpPanel>*{pointer-events:auto}
  #vpTop{position:absolute;left:0;top:0;right:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;background:linear-gradient(#9a6436,#7a4a26);border-bottom:3px solid var(--ink);color:var(--paper);font:600 16px 'Kanit',sans-serif}
  #vpTop small{font:400 11px 'Sarabun',sans-serif;opacity:.8}
  #vpToast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;padding:6px 16px;font:15px 'Kanit';opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
  #vpToast.on{opacity:1}
  #vpToast small{display:block;font:11px 'Sarabun';opacity:.75}
</style>
</head>
<body>
<div id="wrap"><div id="vp">
  <svg id="vpSvg" viewBox="-133.5 0 1067 600"></svg>
  <div id="vpPanel"></div>
  <div id="vpTop"></div>
  <div id="vpToast"></div>
</div></div>
<script src="js/logic/config.js"></script>
<script src="js/logic/calendar.js"></script>
<script src="js/logic/state.js"></script>
<script src="js/logic/endDay.js"></script>
<script src="js/logic/actions.js"></script>
<script src="js/art/draw.js"></script>
<script src="js/art/assets.js"></script>
<script src="js/art/iso.js"></script>
<script src="js/art/crops.js"></script>
<script src="js/art/icons.js"></script>
<script src="js/art/scenery.js"></script>
<script src="js/art/characters.js"></script>
<script src="js/art/props.js"></script>
<script src="js/art/scenes.js"></script>
<script src="js/ui/context.js"></script>
<script src="js/ui/shop.js"></script>
<script>
'use strict';
const vp = document.getElementById('vp'), svgEl = document.getElementById('vpSvg'), panelEl = document.getElementById('vpPanel');
const topEl = document.getElementById('vpTop'), toastEl2 = document.getElementById('vpToast');
const V = (u, v, z = 0) => [400 + (u - v) * 32, 70 + (u + v) * 16 - z];          // village map grid
S = newGame(() => .99); S.money = 3000;
let view = 'map', shopOn = false;

function fitVp() { const k = Math.min(innerWidth / 1067, innerHeight / 600); vp.style.transform = `scale(${k})`; }
addEventListener('resize', fitVp); fitVp();

function say(th, en) { toastEl2.innerHTML = `${th}<small>${en}</small>`; toastEl2.classList.add('on'); clearTimeout(say.t); say.t = setTimeout(() => toastEl2.classList.remove('on'), 1800); }
const img = (id, x, y, k = 1) => Assets.has(id) ? `<g transform="translate(${x} ${y}) scale(${k})">${Assets.image(id)}</g>` : '';

// a wooden name plate with a pin, floating over a place
function plate(x, y, th, en, soon) {
  const w = Math.max(96, th.length * 13 + 26);
  return `<g class="plate" transform="translate(${x} ${y})"><path d="M0 0v18" stroke="${O}" stroke-width="3"/>` +
    `<rect x="${-w / 2}" y="-34" width="${w}" height="34" rx="8" fill="${soon ? '#e8dcc0' : '#fff4d6'}" stroke="${O}" stroke-width="2.6"/>` +
    `<text x="0" y="-17" text-anchor="middle" font-family="Kanit" font-weight="600" font-size="15" fill="${O}">${th}</text>` +
    `<text x="0" y="-6" text-anchor="middle" font-family="Sarabun" font-size="9.5" fill="${O}" opacity=".8">${en}${soon ? ' · soon' : ''}</text></g>`;
}
const PLACES = [
  { id: 'farm', th: 'ไร่ของเรา', en: 'Our farm', at: V(17.2, 5.2, 50), hit: [11, 0, 18, 7] },
  { id: 'market', th: 'ตลาด', en: 'Market', at: V(11.2, 11.2, 8), hit: [6.8, 6.8, 11.4, 11.4] },
  { id: 'pen', th: 'คอกเป็ดลุงมี', en: "Uncle Mee's ducks", at: V(14.2, 17.4, 4), hit: [11, 11.8, 15.2, 16.7] },
  { id: 'temple', th: 'วัด', en: 'Temple', at: V(6.2, 5.6, 40), hit: [1.5, 1.5, 7, 5.5], soon: true },
  { id: 'houses', th: 'บ้านเพื่อนบ้าน', en: 'Neighbours', at: V(4.6, 17.8, 4), hit: [1, 11.8, 6.4, 17.4], soon: true },
];

function mapView() {
  const t = performance.now() / 1000;
  let s = `<image href="prototypes/village_map.svg" x="-300" y="0" width="1400" height="600"/>`;
  const sprites = [];
  // our farm: the Thai house behind its fields, palms and a banana clump
  const hx = V(13, -.9); sprites.push([hx[1], img('scenery.thai_house_iso', ...hx, .55)]);
  [[17.6, .4, 'coconut_lean', .6], [10.9, 6.9, 'sugar_tall', .6], [18.2, 6.6, 'coconut_dwarf', .7]].forEach(([u, v, k, sc]) => sprites.push([V(u, v)[1], img(`scenery.palm_${k}_iso`, ...V(u, v), sc)]));
  sprites.push([V(10.8, 4)[1], img('scenery.banana_ripe_iso', ...V(10.8, 4), .5)]);
  sprites.push([V(17.2, 7.4)[1], `<g transform="translate(${V(17.2, 7.4).join(' ')}) scale(.35) translate(${-V(17.2, 7.4)[0]} ${-V(17.2, 7.4)[1]})">${buffalo(...V(17.2, 7.4))}</g>`]);
  // spirit house by the temple, bananas by the houses
  sprites.push([V(7.2, 1.2)[1], img('scenery.spirit_house_iso', ...V(7.2, 1.2), .35)]);
  sprites.push([V(6.6, 12.2)[1], img('scenery.banana_fruiting_iso', ...V(6.6, 12.2), .45)]);
  // ducks in the pen, people about
  [[12.4, 13], [13.6, 14.2], [14.2, 12.8]].forEach(([u, v], i) => { const [x, y] = V(u, v), d = 8 + i * 2;
    sprites.push([y, `<g transform="translate(${x} ${y}) scale(.55)"><g class="duck" style="animation-duration:${d}s;animation-delay:${-((t + i) % d).toFixed(2)}s"><g class="waddle">${duckShape()}</g></g></g>`]); });
  sprites.push([V(10.6, 15.4)[1], img('character.uncle_mee', ...V(10.6, 15.4), .9)]);
  sprites.push([V(9.2, 11.2)[1], img('character.farmer', ...V(9.2, 11.2), .5)]);
  s += sprites.sort((a, b) => a[0] - b[0]).map(q => q[1]).join('');
  // tappable places: an invisible diamond over the area plus the name plate
  for (const p of PLACES) {
    const [u0, v0, u1, v1] = p.hit, d = [V(u0, v0), V(u1, v0), V(u1, v1), V(u0, v1)].map(q => q.join(',')).join(' ');
    s += `<polygon class="place" data-place="${p.id}" points="${d}" fill="transparent"/>`;
  }
  s += PLACES.map(p => `<g class="place" data-place="${p.id}">${plate(p.at[0], p.at[1], p.th, p.en, p.soon)}</g>`).join('');   // plates on top
  svgEl.innerHTML = s; panelEl.innerHTML = '';
  topEl.innerHTML = `🗺️ หมู่บ้านสุขใจ <small>Sukjai village — tap a place to go inside</small><span style="margin-left:auto">฿${fmt(S.money)}</span>`;
}

// front-view market interior: Auntie Daeng behind a counter, the shop panel on the right
function marketView() {
  let s = `<image href="prototypes/market_inside.svg" x="-300" y="0" width="1400" height="600"/>`;
  s += img('character.auntie_daeng', 190, 410, 2.5);
  // front-view counter with a gingham cloth and baskets of produce
  s += `<rect x="20" y="400" width="340" height="140" fill="#9a6232" stroke="${O}" stroke-width="3"/>` + line('M20 440H360M20 490H360M100 400V540M190 400V540M280 400V540', '#6e4526', 2);
  s += `<path d="M10 392H370L362 430H18Z" fill="#e2453a" stroke="${O}" stroke-width="3"/>`;
  let chk = ''; for (let x = 22; x < 362; x += 14) chk += `M${x} 394v34`; s += line(chk + 'M14 410H366', '#fff', 1.6);
  [[80, 3], [180, 6], [280, 2]].forEach(([x, c]) => { s += `<ellipse cx="${x}" cy="390" rx="38" ry="12" fill="#c9a15a" stroke="${O}" stroke-width="2.4"/>`;
    [-16, 0, 16].forEach(dx => { s += `<g transform="translate(${x + dx} ${378 - Math.abs(dx) * .2}) scale(.8)">${produceIcon(c)}</g>`; }); });
  s += `<g transform="translate(104 150)"><rect x="-80" y="-18" width="160" height="36" rx="8" fill="#fff4d6" stroke="${O}" stroke-width="2.6"/><text y="7" text-anchor="middle" font-family="Kanit" font-size="20" font-weight="700" fill="#c8372d">แผงป้าแดง</text></g>`;
  svgEl.innerHTML = s;
  panelEl.innerHTML = `<div class="bubble" style="left:-110px;top:200px;width:170px">มาแล้วเหรอหลาน<small>Welcome, dear!</small></div>` +
    (shopOn ? shopBoard(SELLERS.daeng).replace('class="shop-board daeng"', 'class="shop-board daeng" style="left:auto;right:-120px"')
      : `<button class="shop-open glow" style="left:430px;top:300px" data-act="shop-open">🛒 ซื้อของป้าแดง<small>Seeds & supplies</small></button>`) +
    `<button class="back" style="left:-110px" data-act="to-map">← หมู่บ้าน<small>Back to the village</small></button>`;
  topEl.innerHTML = `🧺 ตลาด · แผงป้าแดง <small>Inside the market (front view)</small><span style="margin-left:auto">฿${fmt(S.money)}</span>`;
}
function show() { view === 'map' ? mapView() : marketView(); }

vp.addEventListener('click', e => {
  const p = e.target.closest('[data-place]');
  if (p) {
    const pl = PLACES.find(q => q.id === p.dataset.place);
    if (pl.id === 'market') { view = 'market'; shopOn = false; return show(); }
    if (pl.soon) return say(`${pl.th} — เร็ว ๆ นี้`, `${pl.en} — coming soon`);
    return say(`เข้า${pl.th} (ในเกมจริงจะเปิดฉากนั้น)`, `Would open: ${pl.en}`);
  }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'to-map') { view = 'map'; return show(); }
  if (a === 'shop-open') { shopOn = true; ui.shopOpen = 'daeng'; return show(); }
  if (a === 'shop-close') { shopOn = false; return show(); }
  const r = a === 'buy-seed' ? buySeed(S, +b.dataset.c) : a === 'buy-supply' ? buySupply(S, b.dataset.k) : null;
  if (r) { say(r.th, r.en); show(); }
});

Assets.load().then(show);
setInterval(() => { if (view === 'map') mapView(); }, 30000);   // keeps duck animation offsets fresh
</script>
</body>
</html>
